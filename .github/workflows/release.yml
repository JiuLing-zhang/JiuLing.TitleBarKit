name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: |             
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore .\JiuLing.TitleBarKit.sln

      - name: Build
        run: dotnet build .\JiuLing.TitleBarKit.sln --no-restore -c release

      - name: Get version
        uses: olegtarasov/get-tag@v2.1
        id: tagName

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # 配置【README地址】
          body: |
            Release为自动生成，具体内容请查看提交日志，或直接查看[README](https://github.com/JiuLing-zhang/JiuLing.TitleBarKit#readme)

      - name: Publish  
        uses: brandedoutcast/publish-nuget@v2.5.2  
        with:   
          PROJECT_FILE_PATH: src/JiuLing.TitleBarKit.csproj  
          NUGET_KEY: ${{secrets.NUGET_API_KEY}} 
          TAG_COMMIT: false
          INCLUDE_SYMBOLS: true
